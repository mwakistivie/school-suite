const WR=new Set(['marks.save','remark.save','ledger.add','ledger.reverse','stu.save','stu.del','fee.save','fee.apply','hw.add','att.save','notice.add','quiz.submit','term.next','term.promote','users.reset','users.toggle','users.add','file.add','file.del','res.add','res.del','stu.import','stu.undo','stu.archive']);
const NOCACHE=new Set(['file.get','res.get','audit','users.list','ping']);
let _sc;const saveCache=()=>{clearTimeout(_sc);_sc=setTimeout(()=>kv('set','CACHE',CACHE),400)},saveOut=()=>kv('set','OUT',OUT);
const offline=()=>!ONLINE||!navigator.onLine;
function setOnline(v){ONLINE=v;try{localStorage.setItem('maeve_off',v?'':'1')}catch(e){}render();if(v&&navigator.onLine)sync()}
async function setKeep(on){try{localStorage.setItem('maeve_keep',on?'1':'')}catch(e){}if(on&&ME&&MODE!=='demo')await kv('set','SESSION',{tok:TOK,me:ME,ki:KI,exp:Date.now()+7*36e5});else await kv('del','SESSION')}
async function clearOffline(){CACHE={};await kv('del','CACHE');toast('Saved pages cleared');render()}
async function logout(){const n=OUT.filter(q=>ME&&q.uid===ME.id).length;CACHE={};await kv('del','CACHE');await kv('del','SESSION');if(MODE!=='demo'&&TOK&&navigator.onLine)call({action:'logout',token:TOK}).catch(()=>{});TOK=ME=null;VIEW={};if(n)toast(n+' unsynced change(s) kept on this device. Sign in again to send them.');render()}
function dropOut(i){OUT.splice(i,1);saveOut();render()}
function settingsCard(){let keep=false;try{keep=localStorage.getItem('maeve_keep')==='1'}catch(e){}
 return`<div class="c np"><h2>Settings</h2><label style="display:block;padding:8px 0"><input type="checkbox" ${ONLINE?'':'checked'} onchange="setOnline(!this.checked)"> Work offline (use saved pages, queue changes)</label><label style="display:block;padding:8px 0"><input type="checkbox" ${keep?'checked':''} onchange="setKeep(this.checked)"> Keep me signed in on this device for 7 hours (use only on a phone you control)</label><div class="r"><button class="g" onclick="clearOffline()">Clear saved pages</button>${INSTALL?`<button onclick="INSTALL.prompt()">Install app</button>`:''}${NEWSW?`<button onclick="NEWSW.postMessage('skip')">Update app</button>`:''}</div><p class="mu">App v${APP_V} \u00b7 connection: ${MODE} \u00b7 saved pages: ${Object.keys(CACHE).length} \u00b7 unsent changes: ${OUT.length}. On iPhone use Share, then Add to Home Screen.</p></div>`}

addEventListener('online',()=>{if(ONLINE)sync();else render()});addEventListener('offline',()=>render());

let ME=null,TOK=null,ONLINE=(()=>{try{return localStorage.getItem('maeve_off')!=='1'}catch(e){return true}})(),OUT=[],VIEW={},ERR='',CACHE={},INSTALL=null,NEWSW=null,SYNCING=false;
async function op(act,p){const q={act,p:{...p,key:crypto.randomUUID()}};if(offline()){OUT.push({...q,uid:ME.id});saveOut();toast('Offline: queued ('+OUT.length+' pending)');render();return{queued:1}}
 const o=await api(TOK,act,q.p);if(o.neterr){OUT.push({...q,uid:ME.id});saveOut();toast('No connection: saved to outbox');render();return{queued:1}}if(o.err)toast(o.err);return o}
async function sync(replay){if(offline())return toast('Still offline');if(!ME||SYNCING)return;SYNCING=true;const uid=ME.id,mine=OUT.filter(q=>q.uid===uid),rest=OUT.filter(q=>q.uid!==uid);let ok=0,dup=0,bad=[],i=0;
 for(;i<mine.length;i++){const q=mine[i],o=await api(TOK,q.act,q.p);if(o.neterr)break;if(o.err)bad.push({...q,err:o.err});else{ok++;if(o.dup)dup++;if(replay){const d=await api(TOK,q.act,q.p);if(d.dup)dup++}}}
 OUT=rest.concat(bad,mine.slice(i));saveOut();SYNCING=false;if(mine.length)toast('Synced '+ok+', duplicates ignored '+dup+', failed '+bad.length+(i<mine.length?', '+(mine.length-i)+' still waiting':''));render()}
function selfTest(){const c=[[0,'BE2'],[10,'BE2'],[11,'BE1'],[20.9,'BE1'],[21,'AE2'],[30,'AE2'],[31,'AE1'],[40.9,'AE1'],[41,'ME2'],[57.9,'ME2'],[58,'ME1'],[74.9,'ME1'],[75,'EE2'],[89.9,'EE2'],[90,'EE1'],[100,'EE1']].map(([v,e])=>`<tr><td class="n">${v}</td><td>${e}</td><td class="${level(v)===e?'ok':'no'}">${level(v)} ${level(v)===e?'✓':'✗'}</td></tr>`).join('');
 const rk=[90,80,80,70],o=rk.map(x=>rank(rk,x)).join(', ');return`<table><tr><th>Score</th><th>Expected</th><th>Got</th></tr>${c}</table><p class="mu">Ranks for 90, 80, 80, 70: <b class="n ${o==='1, 2, 2, 4'?'ok':'no'}">${o}</b> (expect 1, 2, 2, 4)</p>`}
const bar=()=>ME?`<div class="c r np"><b>${esc(ME.name)}</b><span class="mu">${ME.role}</span>${(TABS[ME.role]||[]).map(([k,l])=>`<button class="${(VIEW.tab||TABS[ME.role][0][0])===k?'':'g'}" onclick="VIEW.tab='${k}';render()">${l}</button>`).join('')}<span style="flex:1"></span><button class="g" onclick="const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'">Theme</button><button class="g" onclick="setOnline(!ONLINE)">${offline()?'Offline':'Online'}</button><button class="g" onclick="VIEW.set=!VIEW.set;render()">Settings</button><button class="g" onclick="sync()">Sync (${OUT.length})</button><button class="g" onclick="logout()">Log out</button></div>`:'';
async function render(){let h=bar()+(ME&&offline()?'<div class="c np" style="border-color:var(--AE)"><b>Offline mode.</b> Showing saved pages. Changes are queued ('+OUT.filter(q=>q.uid===ME.id).length+') and sent when you reconnect.</div>':'');
 if(!ME)h=loginView();
 else if(ME.role==='teacher'||ME.role==='admin'&&VIEW.tab!=='fin')h+=await staff();
 else if(ME.role==='parent'||ME.role==='student')h+=await parent();
 else if(ME.role==='bursar'&&VIEW.tab&&VIEW.tab!=='fin')h+=await staff();
 else h+=await finance();
 if(ME)h+=(VIEW.set?settingsCard():'')+`<div class="c np"><h2>Outbox (${OUT.length})</h2>${OUT.map((q,i)=>`<div class="mu n">${q.act} · key ${q.p.key.slice(0,8)}${q.err?' · '+esc(q.err):''} <button class="g" onclick="dropOut(${i})">Discard</button></div>`).join('')||'<span class="mu">Empty</span>'}<div class="r"><button class="g" onclick="sync(1)">Sync and replay each item (idempotency check)</button></div></div>`;
 $('#app').innerHTML=h}

 <div class="c"><h2>Shared library</h2><div class="r np"><input placeholder="Search title, subject or teacher" value="${esc(VIEW.rq||'')}" onchange="VIEW.rq=this.value;render()"><select onchange="VIEW.rs=this.value;render()"><option value="">All subjects</option>${(o.subjects||[]).map(x=>`<option ${VIEW.rs===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="VIEW.rl=this.value;render()"><option value="">All levels</option>${CLS.map(c=>`<option ${VIEW.rl===c?'selected':''}>${c}</option>`).join('')}</select></div>
 ${o.rows.length?`<div class="s"><table><tr><th>Resource</th><th>Subject</th><th>Level</th><th>Shared by</th><th></th></tr>${o.rows.map(x=>`<tr><td><b>${esc(x.title)}</b>${x.desc?`<div class="mu">${esc(x.desc)}</div>`:''}<div class="mu">${x.at} · ${x.dl} download${x.dl===1?'':'s'}</div></td><td>${esc(x.subj)}</td><td>${esc(x.lvl)}</td><td>${esc(x.byName)}</td><td>${rbtn(x)} ${x.mine?`<button class="g" onclick="delRes('${x.id}')">Remove</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing matches. Share the first resource above.</p>'}</div>`}
async function shareRes(kind){const b={title:$('#rs-t').value,subj:$('#rs-s').value,lvl:$('#rs-l').value,desc:$('#rs-d').value};
 if(kind==='link'){const u=$('#rs-u').value.trim();if(!u)return toast('Paste a link first');Object.assign(b,{type:'link',url:u})}
 else{const f=$('#rs-f').files[0];if(!f)return toast('Choose a file first');if(f.size>2e6)return toast('File is over 2 MB');if(!ONLINE)return toast('Go online to upload');b.data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(f)});Object.assign(b,{type:'file',name:f.name,size:f.size})}
 const o=await op('res.add',b);if(o.err)return toast(o.err);toast(o.queued?'Queued':'Shared with teachers');render()}
async function delRes(id){const o=await op('res.del',{id});if(o.err)return toast(o.err);render()}
async function delFile(id){await op('file.del',{id});render()}
async function dl(id,act='file.get'){const o=await api(TOK,act,{id});if(o.err)return toast(o.err);if(!DLS)return toast('Downloads are not available in this view');const b=Uint8Array.from(atob(o.data),c=>c.charCodeAt(0));try{await DLS.save({filename:o.name,data:b});toast('Saved')}catch(e){toast(e.code==='declined'?'Download cancelled':e.code==='rejected_extension'?'This file type cannot be saved here':'Could not save the file')}}
const dueB=d=>`<span class="b ${d<0?'BE':d<=2?'AE':'ME'}">${d<0?'Overdue':d===0?'Due today':d+' d left'}</span>`;
async function hwFiles(sid,rows){const fl=(await api(TOK,'file.list',{})).rows||[];
 return`<div class="c"><h2>Homework</h2>${rows.length?rows.map(h=>{const d=Math.round((new Date(h.due)-new Date(TODAY))/864e5),m=fl.filter(f=>f.hw===h.id&&f.kind==='material'),sb=fl.filter(f=>f.hw===h.id&&f.kind==='submission'&&f.sid===sid);
  return`<div class="c"><b>${esc(h.title)}</b> ${dueB(d)}<div class="mu">${h.subj} · due ${h.due}</div>${m.length?`<p><b>Materials from teacher</b></p>${m.map(f=>`<div>${fbtn(f)}</div>`).join('')}`:''}<p><b>Your submissions</b></p>${sb.map(f=>`<div>${fbtn(f)} <span class="mu">${f.at}</span> <button class="g" onclick="delFile('${f.id}')">Remove</button></div>`).join('')||'<span class="mu">Nothing submitted yet.</span>'}<div class="r np" style="margin-top:8px"><input type="file" id="uf-${h.id}" accept="${ACC}"><button onclick="upFile('${h.id}','submission','${sid}')">Upload work</button></div><div class="r np"><input id="ul-${h.id}" placeholder="Or paste a link (https://)"><button class="g" onclick="upLink('${h.id}','submission','${sid}')">Submit link</button></div></div>`}).join(''):'<p class="mu">No homework set.</p>'}</div>`}
async function teacherFiles(rows){const fl=(await api(TOK,'file.list',{})).rows||[];
 return rows.map(h=>{const m=fl.filter(f=>f.hw===h.id&&f.kind==='material'),sb=fl.filter(f=>f.hw===h.id&&f.kind==='submission');
  return`<div class="c"><b>${esc(h.title)}</b> <span class="mu">${h.subj} · ${h.stream} · due ${h.due}</span><p><b>Materials for learners</b></p>${m.map(f=>`<div>${fbtn(f)} <button class="g" onclick="delFile('${f.id}')">Remove</button></div>`).join('')||'<span class="mu">None attached.</span>'}<div class="r np" style="margin-top:8px"><input type="file" id="uf-${h.id}" accept="${ACC}"><button onclick="upFile('${h.id}','material')">Upload file</button></div><div class="r np"><input id="ul-${h.id}" placeholder="Or paste a link (https://)"><button class="g" onclick="upLink('${h.id}','material')">Post link</button></div><p><b>Submissions (${sb.length})</b></p>${sb.map(f=>`<div>${esc(f.sname)}: ${fbtn(f)} <span class="mu">${f.at}</span></div>`).join('')||'<span class="mu">No submissions yet.</span>'}</div>`}).join('')}
async function notifCard(all){const o=await api(TOK,'notif.list');return`<div class="c np"><h2>${all?'Notification log':'Notifications'}</h2>${o.rows.length?`<div class="s"><table>${o.rows.map(n=>`<tr><td class="mu n">${esc(n.at)}</td>${all?`<td>${esc(n.to)}</td><td class="n">${esc(n.ph||'—')}</td>`:''}<td><span class="b ME">${esc(n.ev)}</span></td><td>${esc(n.text)}</td>${all?`<td class="mu">${n.ch}</td>`:''}</tr>`).join('')}</table></div>`:'<p class="mu">No notifications yet.</p>'}${all?'<p class="mu">SMS delivery is simulated in this prototype; the log shows what would be sent.</p>':''}</div>`}
async function users(){const o=await api(TOK,'users.list');return`<div class="c"><h2>User management</h2><div class="r np"><input id="nu-id" placeholder="User ID" style="width:110px"><input id="nu-n" placeholder="Full name"><select id="nu-r" onchange="nuRole()">${['teacher','parent','student','bursar','admin'].map(x=>`<option>${x}</option>`).join('')}</select><input id="nu-p" type="password" inputmode="numeric" placeholder="PIN" style="width:90px"></div>
<div class="r np" id="nu-t"><select id="nu-tt" onchange="nuRole()" aria-label="Teacher type"><option value="subject">Subject teacher</option><option value="class">Class teacher</option></select><select id="nu-g" aria-label="Grade">${GRADES.map(g=>`<option>${g}</option>`).join('')}</select><select id="nu-st" aria-label="Stream"><option value="">Both streams</option>${STRM.map(x=>`<option>${x}</option>`).join('')}</select><select id="nu-s" aria-label="Subject"><option value="">Choose subject</option>${SUBJ_ALL.map(x=>`<option>${x}</option>`).join('')}</select></div>
<div class="r np" id="nu-kw" style="display:none"><input id="nu-k" placeholder="Learner admission numbers, e.g. STA001, STA002" style="width:320px"></div><div class="r np"><button onclick="addUser()">Add user</button></div>
<div class="s"><table>${o.rows.map(u=>`<tr><td>${esc(u.name)}<div class="mu">${u.id} · ${u.role==='teacher'?(u.ttype==='class'?'Class teacher':'Subject teacher')+' · '+esc(u.cls||'')+(u.subj?' · '+esc(u.subj):''):u.role}</div></td><td>${u.off?'<span class="b BE">Inactive</span>':u.locked?'<span class="b AE">Locked</span>':'<span class="b EE">Active</span>'}</td><td class="r"><input id="pn-${u.id}" type="password" inputmode="numeric" placeholder="New PIN" style="width:110px"><button class="g" onclick="resetPin('${u.id}')">Reset PIN</button><button class="g" onclick="toggleU('${u.id}')">${u.off?'Activate':'Deactivate'}</button></td></tr>`).join('')}</table></div><p class="mu">Reset also unlocks the account. PINs are hashed; admins can set them but never read them.</p></div>`}
async function resetPin(id){if(!ONLINE)return toast('Go online to reset a PIN');const o=await op('users.reset',{id,pin:$('#pn-'+id).value});if(o.ok)toast('PIN reset for '+id);render()}
async function toggleU(id){if(!ONLINE)return toast('Go online first');await op('users.toggle',{id});render()}
async function rmk(sid,text){await op('remark.save',{sid,text,...TS()});toast('Remark saved')}
async function teacher(){if(MODE!=='demo'&&!TS().subj)return`<div class="c"><h2>Class teacher</h2><p>You are the class teacher for <b>${esc((TS().cls+' '+TS().stream).trim())}</b>. Marks are entered by subject teachers, or ask the admin to add a subject to your account. You can use Attendance, Directory and result slips.</p></div>`;const o=await api(TOK,'marks.list',{...TS()});if(o.err)return`<div class="c no">${o.err}</div>`;const v=o.rows.filter(r=>!r.absent&&r.score!=null).map(r=>r.score);
 return`<div class="c"><h2>${o.subj} · ${MODE==='demo'?'Grade 8 East':(TS().cls+' '+TS().stream).trim()}</h2>${kpi([['Class mean',v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–'],['Top score',v.length?Math.max(...v):'–'],['Lowest',v.length?Math.min(...v):'–'],['Absent',o.rows.filter(r=>r.absent).length],['Marked',v.length+' of '+o.rows.length]])}${dist(v)}<p class="mu">Absent learners are excluded from the mean and rank.</p><div class="s"><table><tr><th>Learner</th><th>Score /100</th><th>Absent</th><th>Level</th><th>Rank</th><th>Report remark</th><th class="np"></th></tr>${o.rows.map(r=>`<tr><td>${esc(r.name)}</td><td><input class="n" style="width:90px" type="number" min="0" max="100" step="0.1" value="${r.absent?'':r.score}" onchange="save('${r.sid}',this.value,false)"></td><td><input type="checkbox" ${r.absent?'checked':''} onchange="save('${r.sid}',0,this.checked)"></td><td>${r.absent?'—':`<span class="b ${level(r.score)}">${level(r.score)}</span>`}</td><td class="n">${r.rank??'—'}</td><td><input value="${esc(r.rem)}" maxlength="120" placeholder="Remark" onchange="rmk('${r.sid}',this.value)"></td><td class="np"><button class="g" onclick="slip('${r.sid}')">Result slip</button></td></tr>`).join('')}</table></div></div>`}
async function save(sid,v,a){await op('marks.save',{sid,...TS(),score:v,absent:a});render()}
async function parent(){const sid=VIEW.sid||ME.kids[0],r=await api(TOK,'child.results',{sid}),f=await api(TOK,'fees.get',{sid}),h=await api(TOK,'hw.list'),at=await api(TOK,'att.sum',{sid}),nt=await api(TOK,'notice.list');
 return`<div class="c r np"><select onchange="VIEW.sid=this.value;render()">${(ME.kids||[]).map(i=>`<option value="${i}" ${i===sid?'selected':''}>${esc(kinfo(i).name||i)} · ${esc(kinfo(i).cls||'')}</option>`).join('')}</select>${MODE==='demo'?`<button class="g" onclick="probe()">Probe: fetch another child’s fees</button>`:''}</div>
 <div class="c" id="rep"><h2>Report card · ${esc(kinfo(sid).name||sid)} · ${r.stream}</h2>${kpi([['Mean',r.mean.toFixed(1)],['Total',r.total],['Class rank',r.rank+' of '+r.of],['Attendance',at.days?Math.round(at.pres/at.days*100)+'%':'–'],['Fee balance',KES(f.bal)]])}${dist(r.rows.filter(x=>!x.absent).map(x=>x.score))}${r.rem?`<p><b>Teacher’s remark:</b> ${esc(r.rem)}</p>`:''}${r.hist.length?`<p class="mu">Previous years: ${r.hist.map(x=>x.year+' '+x.cls+', mean '+x.mean.toFixed(1)+' ('+level(x.mean)+')').join(' · ')}</p>`:''}<div class="np"><button onclick="slip('${sid}')">Download PDF result slip</button> <button class="g" onclick="printDoc('rep','report-card')">Print / save report card</button></div><table>${r.rows.map(x=>`<tr><td>${x.subj}</td><td class="n">${x.absent?'Absent':x.score}</td><td class="n">${x.absent?'—':pts(lvOf(x))}</td><td style="min-width:90px"><div class="d"><i class="${lvOf(x)}" style="width:${x.absent?0:x.score}%"></i></div></td><td><span class="b ${lvOf(x)}">${lvOf(x)}</span></td></tr>`).join('')}</table><p class="mu" style="font-size:12px">${LV.map(x=>x[1]+' '+RANGE[x[1]]+'% ('+x[2]+')').join(' · ')}. Points in brackets.</p></div>
 <div class="c"><h2>Fee statement</h2><p class="n">Balance: <b>${KES(f.bal)}</b></p><table>${f.rows.map(l=>`<tr><td>${esc(l.type)}</td><td>${esc(l.ref||'')}</td><td class="n">${l.amt<0?'−':''}${Math.abs(l.amt).toLocaleString()}</td><td class="n">${l.rc||''}</td></tr>`).join('')}</table></div>${await hwFiles(sid,h.rows.filter(x=>x.stream===(MODE==='demo'?STU[sid][1]:kinfo(sid).cls)))}<div class="np"><h2>Notices</h2>${noteList(nt.rows)}</div>${await notifCard()}${ME.role==='student'?await quizCard():''}`}
async function probe(){const o=await api(TOK,'fees.get',{sid:'STA006'});toast(o.err?'Server refused: '+o.err:'LEAK: data returned')}
async function finance(){const a=await api(TOK,'fees.all'),sid=VIEW.sid||'STA001',f=await api(TOK,'fees.get',{sid});
 const adm=ME.role==='admin'?`<div class="c"><h2>Admin</h2><div class="r"><button class="g" onclick="tamper()">Test: tamper local role, call audit</button></div><table>${((await api(TOK,'audit')).rows||[]).map(x=>`<tr><td class="n">${x.t}</td><td>${x.a}</td><td>${esc(x.d)}</td></tr>`).join('')}</table></div>`:'';
 const out=a.rows.reduce((x,r)=>x+r.bal,0),pc=a.paid/(a.paid+out||1)*100,rc=VIEW.rc&&f.rows.find(l=>l.rc===VIEW.rc),rcpt=rc?`<div class="c" id="rcp"><h2>St. Thomas Catholic Academy · Official receipt</h2><p class="n">${rc.rc} · ${rc.at||'—'}</p><p>Received for <b>${esc(nmOf(a.rows,sid))}</b> (${sid})</p><p class="n"><b>${KES(-rc.amt)}</b> via ${esc(rc.method)} · Ref ${esc(rc.ref||'—')}</p><p class="mu n">Integrity code: ${rc.h||'seed'}</p><div class="np r"><button onclick="printDoc('rcp','receipt')">Print / save</button><button class="g" onclick="VIEW.rc=null;render()">Close</button></div></div>`:'';return`<div class="c"><h2>Fee balances</h2>${kpi([['Collected',KES(a.paid)],['Outstanding',KES(out)],['Collection rate',Math.round(pc)+'%'],['Defaulters',a.rows.filter(r=>r.bal>0).length+' of '+a.rows.length]])}<div class="d" style="margin:8px 0"><i class="EE" style="width:${pc}%"></i></div><label class="mu"><input type="checkbox" ${VIEW.def?'checked':''} onchange="VIEW.def=this.checked;render()"> Defaulters only</label><div class="s"><table>${a.rows.filter(r=>!VIEW.def||r.bal>0).map(r=>`<tr onclick="VIEW.sid='${r.sid}';render()" style="cursor:pointer"><td>${esc(r.name)}</td><td class="n">${r.sid}</td><td class="n">${KES(r.bal)}</td></tr>`).join('')}</table></div></div>
 ${rcpt}<div class="c"><h2>Record payment · ${esc(nmOf(a.rows,sid))}</h2><div class="r"><input id="am" type="number" placeholder="Amount" class="n"><select id="me"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select><input id="rf" placeholder="Reference code"><button onclick="pay('${sid}')">Save</button></div>
 <table>${f.rows.map(l=>`<tr><td>${l.type}</td><td>${esc(l.ref||'')}</td><td class="n">${l.amt<0?'−':''}${Math.abs(l.amt).toLocaleString()}</td><td class="n">${l.rc?`<button class="g" onclick="VIEW.rc='${l.rc}';render()">${l.rc}</button>`:''} ${l.h||''}</td><td>${['payment','charge','bursary'].includes(l.type)&&!f.rows.some(x=>x.rev===l.id)?`<button class="g" onclick="rev('${l.id}')">Reverse</button>`:''}</td></tr>`).join('')}</table></div>${adm}`}
async function pay(sid){const o=await op('ledger.add',{sid,type:'payment',amount:$('#am').value,method:$('#me').value,ref:$('#rf').value.trim()});if(o.rc){VIEW.rc=o.rc;toast('Receipt '+o.rc)}render()}
async function rev(id){await op('ledger.reverse',{id});render()}
async function tamper(){const real=ME.role;ME.role='admin';const s=SESS.get(TOK),r=s.role;s.role='parent';const o=await api(TOK,'audit');s.role=r;ME.role=real;toast(o.err?'Server ignored the client role: '+o.err:'FAIL')}
(async()=>{OUT=(await kv('get','OUT'))||[];if(MODE!=='demo'){const S=await kv('get','SESSION');if(S&&S.exp>Date.now()){TOK=S.tok;ME=S.me;KI=S.ki||{};VIEW={tab:ME.role==='admin'?'fin':''};CACHE=(await kv('get','CACHE'))||{};render();sync();return}}render()})();
</script></body></html>
