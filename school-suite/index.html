 return`<div class="c"><h2>Fee structure · Term ${o.term||TERM.no}</h2><div class="s"><table><tr><th>Class</th><th>Fee per term</th><th>Learners</th><th>Billed</th><th>Expected</th><th></th></tr>${o.rows.map(x=>`<tr><td>${x.cls}</td><td><input class="n" style="width:110px" type="number" min="0" value="${x.amt}" onchange="setFee('${x.cls}',this.value)"></td><td class="n">${x.n}</td><td class="n">${x.billed}</td><td class="n">${KES(x.amt*x.n)}</td><td>${x.billed<x.n?`<button class="g" onclick="applyFee('${x.cls}')">Bill ${x.n-x.billed}</button>`:'<span class="mu">Up to date</span>'}</td></tr>`).join('')}</table></div><p class="mu">Changing a fee does not alter charges already billed. Corrections are made with reversal entries in the ledger.</p></div>`}

async function quizCard(){const L=await api(TOK,'quiz.list');if(VIEW.qz){const g=await api(TOK,'quiz.get',{id:VIEW.qz});if(g.err)return`<div class="c no">${g.err}</div>`;

 return`<div class="c"><h2>Academic calendar</h2>${kpi([['Year',o.year],['Term',o.no],['Promotion',o.promo?'Done':o.no===3?'Due':'Not yet']])}<div class="r np"><button onclick="termNext()">Start next term</button>${o.no===3&&!o.promo?`<button class="g" onclick="promote()">${VIEW.pc?'Confirm promotion':'Run year-end promotion'}</button>`:''}</div><p class="mu">Balances carry forward automatically because they come from the ledger. After a new term starts, bill each class in Fee structure.</p></div><div class="c"><h2>Promotion preview</h2><div class="s"><table><tr><th>Class</th><th>Learners</th><th>Moves to</th></tr>${o.counts.map(x=>`<tr><td>${x.cls}</td><td class="n">${x.n}</td><td>${x.to}</td></tr>`).join('')}</table></div><p class="mu">Promotion saves each learner’s year summary, then clears marks, remarks and attendance for the new year. Grade 9 learners become Alumni.</p></div>`}

let DLS=null;(window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(d=>DLS=d).catch(()=>{});if(!(window.claude&&claude.use))DLS={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};

 if(DLS){try{await DLS.save({filename:name+'.html',data:html});toast('Saved. Open the saved file and it will print.')}catch(e){if(e.code!=='declined')toast('Could not save the file')}}else window.print()}
const fbtn=f=>f.type==='link'?`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.name||f.url)}</a>`:`<button class="g" onclick="dl('${f.id}')">Download ${esc(f.name)}</button>`;

async function resources(){const o=await api(TOK,'res.list',{q:VIEW.rq||'',subj:VIEW.rs||'',lvl:VIEW.rl||''});if(o.err)return`<div class="c no">${o.err}</div>`;
 return`<div class="c np"><h2>Share a resource</h2><p class="mu">Lesson plans, worksheets and links for other teachers. Visible to staff only, never to parents or learners.</p><div class="r"><input id="rs-t" placeholder="Title" maxlength="100"><input id="rs-s" placeholder="Subject" maxlength="40" list="rs-sl" style="width:140px"><datalist id="rs-sl">${(o.subjects||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><select id="rs-l"><option>All levels</option>${CLS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="r"><input id="rs-d" placeholder="Short description (optional)" maxlength="300" style="flex:1"></div><div class="r"><input type="file" id="rs-f" accept="${ACC}"><button onclick="shareRes('file')">Share file</button></div><div class="r"><input id="rs-u" placeholder="Or paste a link (https://)"><button class="g" onclick="shareRes('link')">Share link</button></div></div>

 ${o.rows.length?`<div class="s"><table><tr><th>Resource</th><th>Subject</th><th>Level</th><th>Shared by</th><th></th></tr>${o.rows.map(x=>`<tr><td><b>${esc(x.title)}</b>${x.desc?`<div class="mu">${esc(x.desc)}</div>`:''}<div class="mu">${x.at} · ${x.dl} download${x.dl===1?'':'s'}</div></td><td>${esc(x.subj)}</td><td>${esc(x.lvl)}</td><td>${esc(x.byName)}</td><td>${rbtn(x)} ${x.mine?`<button class="g" onclick="delRes('${x.id}')">Remove</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing matches. Share the first resource above.</p>'}</div>`}

async function rmk(sid,text){await op('remark.save',{sid,text,stream:'8E',cls:'Grade 8'});toast('Remark saved')}
async function teacher(){const o=await api(TOK,'marks.list',{stream:'8E',cls:'Grade 8',subj:'Mathematics'});if(o.err)return`<div class="c no">${o.err}</div>`;const v=o.rows.filter(r=>!r.absent&&r.score!=null).map(r=>r.score);
 return`<div class="c"><h2>${o.subj} · Grade 8 East</h2>${kpi([['Class mean',v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–'],['Top score',v.length?Math.max(...v):'–'],['Lowest',v.length?Math.min(...v):'–'],['Absent',o.rows.filter(r=>r.absent).length],['Marked',v.length+' of '+o.rows.length]])}${dist(v)}<p class="mu">Absent learners are excluded from the mean and rank.</p><div class="s"><table><tr><th>Learner</th><th>Score /100</th><th>Absent</th><th>Level</th><th>Rank</th><th>Report remark</th></tr>${o.rows.map(r=>`<tr><td>${esc(r.name)}</td><td><input class="n" style="width:90px" type="number" min="0" max="100" step="0.1" value="${r.absent?'':r.score}" onchange="save('${r.sid}',this.value,false)"></td><td><input type="checkbox" ${r.absent?'checked':''} onchange="save('${r.sid}',0,this.checked)"></td><td>${r.absent?'—':`<span class="b ${level(r.score)}">${level(r.score)}</span>`}</td><td class="n">${r.rank??'—'}</td><td><input value="${esc(r.rem)}" maxlength="120" placeholder="Remark" onchange="rmk('${r.sid}',this.value)"></td></tr>`).join('')}</table></div></div>`}
async function save(sid,v,a){await op('marks.save',{sid,subj:'Mathematics',stream:'8E',cls:'Grade 8',score:v,absent:a});render()}
async function parent(){const sid=VIEW.sid||ME.kids[0],r=await api(TOK,'child.results',{sid}),f=await api(TOK,'fees.get',{sid}),h=await api(TOK,'hw.list'),at=await api(TOK,'att.sum',{sid}),nt=await api(TOK,'notice.list');
 return`<div class="c r np"><select onchange="VIEW.sid=this.value;render()">${(ME.kids||[]).map(i=>`<option value="${i}" ${i===sid?'selected':''}>${esc(kinfo(i).name||i)} · ${esc(kinfo(i).cls||'')}</option>`).join('')}</select><button class="g" onclick="probe()">Probe: fetch another child’s fees</button></div>
 <div class="c" id="rep"><h2>Report card · ${esc(kinfo(sid).name||sid)} · ${r.stream}</h2>${kpi([['Mean',r.mean.toFixed(1)],['Total',r.total],['Class rank',r.rank+' of '+r.of],['Attendance',at.days?Math.round(at.pres/at.days*100)+'%':'–'],['Fee balance',KES(f.bal)]])}${dist(r.rows.filter(x=>!x.absent).map(x=>x.score))}${r.rem?`<p><b>Teacher’s remark:</b> ${esc(r.rem)}</p>`:''}${r.hist.length?`<p class="mu">Previous years: ${r.hist.map(x=>x.year+' '+x.cls+', mean '+x.mean.toFixed(1)+' ('+level(x.mean)+')').join(' · ')}</p>`:''}<div class="np"><button class="g" onclick="printDoc('rep','report-card')">Print / save report card</button></div><table>${r.rows.map(x=>`<tr><td>${x.subj}</td><td class="n">${x.absent?'Absent':x.score}</td><td class="n">${x.absent?'—':pts(lvOf(x))}</td><td style="min-width:90px"><div class="d"><i class="${lvOf(x)}" style="width:${x.absent?0:x.score}%"></i></div></td><td><span class="b ${lvOf(x)}">${lvOf(x)}</span></td></tr>`).join('')}</table><p class="mu" style="font-size:12px">${LV.map(x=>x[1]+' '+RANGE[x[1]]+'% ('+x[2]+')').join(' · ')}. Points in brackets.</p></div>
 <div class="c"><h2>Fee statement</h2><p class="n">Balance: <b>${KES(f.bal)}</b></p><table>${f.rows.map(l=>`<tr><td>${esc(l.type)}</td><td>${esc(l.ref||'')}</td><td class="n">${l.amt<0?'−':''}${Math.abs(l.amt).toLocaleString()}</td><td class="n">${l.rc||''}</td></tr>`).join('')}</table></div>${await hwFiles(sid,h.rows.filter(x=>x.stream===(MODE==='demo'?STU[sid][1]:kinfo(sid).cls)))}<div class="np"><h2>Notices</h2>${noteList(nt.rows)}</div>${await notifCard()}${ME.role==='student'?await quizCard():''}`}
async function probe(){const o=await api(TOK,'fees.get',{sid:'STA006'});toast(o.err?'Server refused: '+o.err:'LEAK: data returned')}
async function finance(){const a=await api(TOK,'fees.all'),sid=VIEW.sid||'STA001',f=await api(TOK,'fees.get',{sid});
 const adm=ME.role==='admin'?`<div class="c"><h2>Admin</h2><div class="r"><button class="g" onclick="tamper()">Test: tamper local role, call audit</button></div><table>${((await api(TOK,'audit')).rows||[]).map(x=>`<tr><td class="n">${x.t}</td><td>${x.a}</td><td>${esc(x.d)}</td></tr>`).join('')}</table></div>`:'';
 const out=a.rows.reduce((x,r)=>x+r.bal,0),pc=a.paid/(a.paid+out||1)*100,rc=VIEW.rc&&f.rows.find(l=>l.rc===VIEW.rc),rcpt=rc?`<div class="c" id="rcp"><h2>St. Thomas Catholic Academy · Official receipt</h2><p class="n">${rc.rc} · ${rc.at||'—'}</p><p>Received for <b>${esc(nmOf(a.rows,sid))}</b> (${sid})</p><p class="n"><b>${KES(-rc.amt)}</b> via ${esc(rc.method)} · Ref ${esc(rc.ref||'—')}</p><p class="mu n">Integrity code: ${rc.h||'seed'}</p><div class="np r"><button onclick="printDoc('rcp','receipt')">Print / save</button><button class="g" onclick="VIEW.rc=null;render()">Close</button></div></div>`:'';return`<div class="c"><h2>Fee balances</h2>${kpi([['Collected',KES(a.paid)],['Outstanding',KES(out)],['Collection rate',Math.round(pc)+'%'],['Defaulters',a.rows.filter(r=>r.bal>0).length+' of '+a.rows.length]])}<div class="d" style="margin:8px 0"><i class="EE" style="width:${pc}%"></i></div><label class="mu"><input type="checkbox" ${VIEW.def?'checked':''} onchange="VIEW.def=this.checked;render()"> Defaulters only</label><div class="s"><table>${a.rows.filter(r=>!VIEW.def||r.bal>0).map(r=>`<tr onclick="VIEW.sid='${r.sid}';render()" style="cursor:pointer"><td>${esc(r.name)}</td><td class="n">${r.sid}</td><td class="n">${KES(r.bal)}</td></tr>`).join('')}</table></div></div>
 ${rcpt}<div class="c"><h2>Record payment · ${esc(nmOf(a.rows,sid))}</h2><div class="r"><input id="am" type="number" placeholder="Amount" class="n"><select id="me"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select><input id="rf" placeholder="Reference code"><button onclick="pay('${sid}')">Save</button></div>
 <table>${f.rows.map(l=>`<tr><td>${l.type}</td><td>${esc(l.ref||'')}</td><td class="n">${l.amt<0?'−':''}${Math.abs(l.amt).toLocaleString()}</td><td class="n">${l.rc?`<button class="g" onclick="VIEW.rc='${l.rc}';render()">${l.rc}</button>`:''} ${l.h||''}</td><td>${['payment','charge','bursary'].includes(l.type)&&!f.rows.some(x=>x.rev===l.id)?`<button class="g" onclick="rev('${l.id}')">Reverse</button>`:''}</td></tr>`).join('')}</table></div>${adm}`}
async function pay(sid){const o=await op('ledger.add',{sid,type:'payment',amount:$('#am').value,method:$('#me').value,ref:$('#rf').value.trim()});if(o.rc){VIEW.rc=o.rc;toast('Receipt '+o.rc)}render()}
async function rev(id){await op('ledger.reverse',{id});render()}
async function tamper(){const real=ME.role;ME.role='admin';const s=SESS.get(TOK),r=s.role;s.role='parent';const o=await api(TOK,'audit');s.role=r;ME.role=real;toast(o.err?'Server ignored the client role: '+o.err:'FAIL')}
(async()=>{OUT=(await kv('get','OUT'))||[];if(MODE!=='demo'){const S=await kv('get','SESSION');if(S&&S.exp>Date.now()){TOK=S.tok;ME=S.me;KI=S.ki||{};VIEW={tab:ME.role==='admin'?'fin':''};CACHE=(await kv('get','CACHE'))||{};render();sync();return}}render()})();
</script></body></html>
